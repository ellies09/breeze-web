<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B4332">
<title>Breeze</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --forest: #1B4332;
    --green: #2D6A4F;
    --sage: #52796F;
    --sand: #A67C52;
    --beige: #F7F5F0;
    --ink: #12100C;
    --error: #C00000;
    --surface: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--beige);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; min-height: 100dvh; }

  .topbar {
    background: var(--forest);
    color: #fff;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 18px;
  }
  .topbar .sub { font-weight: 400; font-size: 12px; opacity: .85; margin-left: auto; }

  .screen { flex: 1; display: flex; flex-direction: column; padding: 24px 20px; }
  .center { align-items: center; justify-content: center; text-align: center; }

  h1.logo { font-size: 40px; font-weight: 800; color: var(--green); margin: 0 0 2px; }
  .tagline { color: var(--sage); font-size: 13px; margin-bottom: 20px; }

  .tabs { display: flex; gap: 6px; width: 100%; max-width: 380px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 8px 4px; font-size: 11px; text-align: center; border-radius: 8px;
    border: 1px solid var(--green); background: transparent; color: var(--green);
    cursor: pointer; line-height: 1.3;
  }
  .tab.active { background: var(--green); color: #fff; }

  .field-group { width: 100%; max-width: 380px; margin-bottom: 12px; text-align: left; }
  label { display: block; font-size: 12px; color: var(--sage); margin-bottom: 4px; }
  .input-wrap { position: relative; }
  input[type="text"], input[type="email"], input[type="password"], textarea {
    width: 100%; padding: 12px 14px; border: 1px solid #cfc9bd; border-radius: 10px;
    font-size: 15px; background: var(--surface); color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid var(--green); border-color: var(--green); }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  .pw-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px;
  }
  .hint { font-size: 11px; color: var(--sage); margin-top: 6px; }
  .error { color: var(--error); font-size: 13px; margin: 4px 0 0; }
  .success { color: var(--green); font-size: 13px; margin: 4px 0 0; }

  button.primary {
    width: 100%; max-width: 380px; padding: 13px; border: none; border-radius: 10px;
    background: var(--green); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    margin-top: 4px;
  }
  button.primary:disabled { background: #b7c2bc; cursor: not-allowed; }
  button.primary:active { background: var(--forest); }

  .foot-note { font-size: 11px; color: var(--sage); margin-top: 16px; max-width: 380px; }

  .spinner {
    width: 28px; height: 28px; border: 3px solid #d8d3c6; border-top-color: var(--green);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Écran principal */
  .profile-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid #e5e0d5; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; background: var(--sand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
    flex-shrink: 0;
  }
  .profile-name { font-weight: 700; font-size: 16px; }
  .profile-email { font-size: 12px; color: var(--sage); }
  .signout { margin-left: auto; background: none; border: none; color: var(--error); font-size: 13px; cursor: pointer; }

  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #eee8db;
  }
  .list-item .name { font-weight: 600; font-size: 15px; }
  .list-item .preview { font-size: 12px; color: var(--sage); }
  .empty { padding: 32px 20px; text-align: center; color: var(--sage); font-size: 13px; }

  .banner {
    background: #fdf0e4; color: #7D4F35; font-size: 12px; padding: 10px 16px; text-align: center;
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js?v=11"></script>
</body>
</html>
